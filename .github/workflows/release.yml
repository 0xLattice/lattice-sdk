name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == '0xLattice/lattice-sdk'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release builds use npm's OIDC trusted publishing. Avoid restoring
          # package-manager caches into the credential-bearing job.
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      # Dependency order matters for a new release. Authentication is npm's
      # GitHub OIDC trusted publishing; no long-lived npm token is stored.
      - run: npm publish --workspace @adalin/lattice-core --provenance --access public
      - run: npm publish --workspace @adalin/lattice-volumes --provenance --access public
      - run: npm publish --workspace @adalin/lattice-client --provenance --access public
      - run: npm publish --workspace @adalin/lattice-relay --provenance --access public
      - run: npm publish --workspace @adalin/lattice-sdk --provenance --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
