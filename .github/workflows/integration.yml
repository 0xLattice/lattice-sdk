name: Node integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: 0xLattice/lattice-node
          path: .integration/lattice-node
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the real node and mining coordinator
        run: swift build --package-path .integration/lattice-node -c debug
      # lattice-sponsor from its pinned image, run beside the node as a binary.
      - name: The pinned lattice-sponsor
        run: |
          docker create --name sponsor ghcr.io/0xlattice/lattice-sponsor:sha-24d8c4d
          docker cp sponsor:/usr/local/bin/lattice-sponsor "$RUNNER_TEMP/lattice-sponsor"
          docker rm sponsor
      - name: Exercise reads, relay policy, mining, inclusion, and paying a sponsor in work
        env:
          LATTICE_NODE_BIN: ${{ github.workspace }}/.integration/lattice-node/.build/debug
          LATTICE_SPONSOR_BIN: ${{ runner.temp }}/lattice-sponsor
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: local-node-e2e-logs
          path: /tmp/lattice-sdk-e2e-*/*.log
          if-no-files-found: ignore
